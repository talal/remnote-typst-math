[package]
edition = "2021"
name = "tylax"
version = "0.3.7"
build = false
exclude = [
    "web/**/*",
    "tools/**/*",
    ".github/**/*",
    "pkg/**/*",
    "examples/**/*",
    "Dockerfile",
    "docker-compose.yml",
    "bindings/**/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tylax - High-performance bidirectional LaTeX ↔ Typst converter"
readme = "README.md"
keywords = [
    "latex",
    "typst",
    "converter",
    "math",
    "wasm",
]
categories = [
    "text-processing",
    "wasm",
    "command-line-utilities",
]
license = "Apache-2.0"
repository = "https://github.com/scipenai/tylax"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[features]
cli = ["dep:clap"]
data-loading = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:csv",
    "dep:toml",
]
default = ["cli"]
wasm = [
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:serde",
    "dep:serde-wasm-bindgen",
]

[lib]
name = "tylax"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[bin]]
name = "t2l"
path = "src/bin/t2l.rs"

[[test]]
